<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SanoFarmacia — Gestión profesional para farmacias</title>
  <meta name="description" content="SanoFarmacia: sistema para farmacias de Latinoamérica. Venta por caja, blíster o unidad con lector de código de barras, lotes y vencimientos (sale primero lo que vence antes), libro de recetas y controlados, pacientes con alergias y tratamientos, recordatorios de recompra por WhatsApp, convenios y seguros, puntos, catálogo para pedidos en línea con delivery, compras a proveedores y cuentas por pagar, caja en dos monedas y reportes de ganancia. Funciona en el teléfono y en la computadora, también sin internet.">
  <meta name="theme-color" content="#04211c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SanoFarmacia">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/assets/logo.svg">
  <link rel="icon" type="image/png" sizes="48x48" href="/assets/favicon.png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('sf_theme');
        if (!t) t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="boot" class="boot">
    <div class="boot-inner">
      <img src="/assets/icon-192.png" alt="SanoFarmacia">
      <div class="spinner"></div>
    </div>
  </div>
  <div id="root"></div>
  <div id="modals"></div>
  <div id="toasts" class="toasts"></div>
  <noscript>SanoFarmacia necesita JavaScript habilitado.</noscript>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
